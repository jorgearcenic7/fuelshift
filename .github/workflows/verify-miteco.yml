name: Verificación manual MITECO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miteco-live:
    name: miteco-live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: pipeline/src

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.lock

      - name: Ejecutar pruebas sin red
        run: python -m pytest

      - name: Verificar la ingesta real
        run: python -m fuelshift_data --output data/processed/miteco

      - name: Conservar artefacto temporal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miteco-static-json
          path: data/processed/miteco
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
