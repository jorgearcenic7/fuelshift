name: Verificación manual MITECO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miteco-live:
    name: miteco-live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: pipeline/src

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.lock

      - name: Ejecutar pruebas sin red
        run: python -m pytest

      - name: Verificar la ingesta real
        run: python -m fuelshift_data --output data/processed/miteco

      - name: Conservar artefacto temporal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miteco-static-json
          path: data/processed/miteco
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
