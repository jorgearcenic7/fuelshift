# Intermediario de rutas de FuelShift (ADR docs/decisions/0007-intermediario-de-rutas.md).
# No se despliega desde la CI ni hay workflow que lo haga. Desactivado por defecto: los
# interruptores solo los cambia el propietario tras verificar cuentas y condiciones.
name = "fuelshift-rutas"
main = "src/index.ts"
# Fecha soportada por workerd incluido en Wrangler 4.149.0, comprobado en local.
compatibility_date = "2026-10-13"
# URL pública *.workers.dev para el frontend; sin URL de vista previa por versión.
workers_dev = true
preview_urls = false

[vars]
ROUTING_ENABLED = "false"
GEOAPIFY_ENABLED = "false"
# Matriz y ruta no tienen cota de coste previa (recargo por distancia). Solo se habilitan
# con uno de estos valores exactos (ADR 0007):
# - "confirmada-por-escrito": Geoapify ha confirmado por escrito que superar la cuota no
#   genera cargos. Presupuesto de 2400 créditos por 24 h.
# - "provisional-sin-confirmacion": el propietario acepta el riesgo residual sin esa
#   confirmación. Presupuesto reducido a 300 créditos por 24 h.
# Cualquier otro valor bloquea matriz y ruta. La ausencia de tarjeta no es garantía.
# Estos valores del repositorio quedan desactivados: la activación se hace con --var al
# desplegar, de modo que un despliegue sin ellas vuelve al estado seguro.
GEOAPIFY_CHARGE_GUARANTEE = "ninguna"
ALLOWED_ORIGINS = "https://fuelshift.pages.dev"
# Secretos (wrangler secret put): GEOAPIFY_API_KEY, VISITOR_SALT. La clave y el proyecto de
# Geoapify son exclusivos de este Worker de producción. Restaurar la clave solo después de
# desplegar los valores desactivados: secret put hereda los vars vigentes (ADR 0007).

[[durable_objects.bindings]]
name = "ROUTING_BUDGET"
class_name = "RoutingBudget"

# Durable Object con SQLite: el único backend disponible en Workers Free.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoutingBudget"]
