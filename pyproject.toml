[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fuelshift-data"
version = "0.1.0"
description = "Base del pipeline de datos oficiales de FuelShift."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline/src/fuelshift_data"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["pipeline/src"]
testpaths = ["pipeline/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["pipeline/src", "pipeline/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
